name: CI

# Everything here is offline. No job may send a NetEase request.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-verification:
    # macOS 15 on Apple Silicon, matching the only supported target.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/ci.yml")'

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Debug tests
        working-directory: Packages/MacEaseCore
        run: swift test

      - name: Release tests
        working-directory: Packages/MacEaseCore
        run: swift test -c release

      - name: Release build
        working-directory: Packages/MacEaseCore
        run: swift build -c release --arch arm64

      - name: Whitespace in the submitted commit range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA" && test -n "$PR_HEAD_SHA"
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" \
              && -n "$PUSH_BEFORE_SHA" \
              && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            empty_tree=$(git hash-object -t tree /dev/null)
            git diff --check "$empty_tree" HEAD
          fi

      - name: No unresolved conflict markers in tracked files
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- .; then
            echo "::error::an unresolved merge conflict marker is committed"
            exit 1
          fi

      - name: No process-terminating paths on untrusted input
        run: |
          if grep -RInE 'as!|try!|precondition\(|fatalError\(' \
              Packages/MacEaseCore/Sources; then
            echo "::error::untrusted-input paths must classify, not terminate"
            exit 1
          fi

      - name: No credentials or response samples in the tree
        run: |
          if grep -RInE 'MUSIC_U=[A-Za-z0-9]{16,}|__csrf=[A-Za-z0-9]{16,}' \
              --exclude-dir=.git .; then
            echo "::error::a real-looking cookie value is committed"
            exit 1
          fi
