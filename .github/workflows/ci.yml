name: CI

# Everything here is offline. No job may send a NetEase request.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-verification:
    # macOS 15 on Apple Silicon, matching the only supported target.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check submitted diff and select validation
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA" && test -n "$PR_HEAD_SHA"
            diff_args=("$PR_BASE_SHA...$PR_HEAD_SHA")
          elif [[ "$GITHUB_EVENT_NAME" == "push" \
              && -n "$PUSH_BEFORE_SHA" \
              && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            diff_args=("$PUSH_BEFORE_SHA" "$GITHUB_SHA")
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            diff_args=(HEAD^ HEAD)
          else
            empty_tree=$(git hash-object -t tree /dev/null)
            diff_args=("$empty_tree" HEAD)
          fi
          git diff --check "${diff_args[@]}"
          changed_files=$(git diff --name-only "${diff_args[@]}" -- . ':!*.md')
          # A new branch has no push baseline; keep full validation in that case.
          if [[ -n "$changed_files" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" \
              || ( "$GITHUB_EVENT_NAME" == "push" \
                && ( -z "$PUSH_BEFORE_SHA" \
                  || "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ) ) ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Apple Silicon runner
        if: steps.changes.outputs.code == 'true'
        run: test "$(uname -m)" = arm64

      - name: Show toolchain
        if: steps.changes.outputs.code == 'true'
        run: swift --version && xcodebuild -version

      - name: Debug tests
        if: steps.changes.outputs.code == 'true'
        working-directory: Packages/MacEaseCore
        run: swift test

      - name: Release tests
        if: steps.changes.outputs.code == 'true'
        working-directory: Packages/MacEaseCore
        run: swift test -c release

      - name: Release build
        if: steps.changes.outputs.code == 'true'
        working-directory: Packages/MacEaseCore
        run: swift build -c release --arch arm64

      - name: No unresolved conflict markers in tracked files
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- .; then
            echo "::error::an unresolved merge conflict marker is committed"
            exit 1
          fi

      - name: No credentials in tracked content
        run: |
          # Synthetic cookies use visibly fake values (for example music-u-test).
          # Scan the checkout index, including tests; print filenames, never values.
          if git grep --cached -lIE 'MUSIC_U=[A-Za-z0-9]{16,}|__csrf=[A-Za-z0-9]{16,}' -- .; then
            echo "::error::a real-looking cookie value is committed"
            exit 1
          else
            result=$?
            if (( result > 1 )); then exit "$result"; fi
          fi
